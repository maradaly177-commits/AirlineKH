version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: airlinekh-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=airline_db
      - DB_USERNAME=airline_user
      - DB_PASSWORD=SkyLink@Pass2026
    depends_on:
      - db
    networks:
      - airline-network

  db:
    image: mysql:8.0
    container_name: airlinekh-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: airline_db
      MYSQL_USER: airline_user
      MYSQL_PASSWORD: SkyLink@Pass2026
      MYSQL_ROOT_PASSWORD: RootPassword@2026
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - airline-network

  web:
    image: nginx:alpine
    container_name: airlinekh-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./nginx.docker.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - airline-network

networks:
  airline-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
