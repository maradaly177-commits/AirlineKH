  <g>
    <line x1="90" y1="255" x2="275" y2="305" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
  </g>
  
  <g>
    <line x1="90" y1="260" x2="275" y2="365" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
  </g>
  
  <g>
    <line x1="90" y1="265" x2="265" y2="425" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
