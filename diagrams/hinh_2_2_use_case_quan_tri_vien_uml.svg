<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" width="900" height="820">
  <defs>
    <marker id="openArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.5"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <!-- System Boundary -->
  <rect x="220" y="30" width="640" height="760" fill="#FFFFFF" stroke="#000000" stroke-width="2" filter="url(#shadow)"/>
  
  <!-- Note Box top right -->
  <g transform="translate(640, 45)">
    <path d="M 0 0 L 170 0 L 195 25 L 195 75 L 0 75 Z" fill="#FFD1D1" stroke="#000000" stroke-width="1.5"/>
    <path d="M 170 0 L 170 25 L 195 25" fill="#FFB0B0" stroke="#000000" stroke-width="1.5"/>
    <text x="10" y="20" font-size="11" font-family="Arial" fill="#000000" font-weight="bold">CRUD: Thêm, sửa, xóa,</text>
    <text x="10" y="38" font-size="11" font-family="Arial" fill="#000000">xem thông tin chuyến bay,</text>
    <text x="10" y="56" font-size="11" font-family="Arial" fill="#000000">sân bay, vé, người dùng.</text>
  </g>

  <!-- Title -->
  <text x="440" y="65" text-anchor="middle" font-size="16" font-weight="bold" font-family="Arial" fill="#000000">Phân hệ Quản trị viên (Admin) - SkyLink Airline</text>

  <!-- Actor -->
  
  <g transform="translate(65, 360)">
    <!-- Head -->
    <circle cx="20" cy="15" r="14" fill="none" stroke="#000000" stroke-width="2"/>
    <!-- Body -->
    <line x1="20" y1="29" x2="20" y2="65" stroke="#000000" stroke-width="2"/>
    <!-- Arms -->
    <line x1="20" y1="40" x2="-5" y2="52" stroke="#000000" stroke-width="2"/>
    <line x1="20" y1="40" x2="45" y2="52" stroke="#000000" stroke-width="2"/>
    <!-- Legs -->
    <line x1="20" y1="65" x2="-2" y2="95" stroke="#000000" stroke-width="2"/>
    <line x1="20" y1="65" x2="42" y2="95" stroke="#000000" stroke-width="2"/>
    <!-- Label -->
    <text x="20" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" font-family="Arial">Quản trị viên</text>
  </g>

  <!-- Primary Use Cases (Middle Column) -->
  
  <g>
    <ellipse cx="420" cy="140" rx="110" ry="30" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="420" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Xem Dashboard</text>
      <text x="420" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">& Thống kê</text>
    
  </g>
  
  <g>
    <ellipse cx="420" cy="260" rx="115" ry="30" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    <text x="420" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000" font-family="Arial">Quản lý Chuyến bay</text>
  </g>
  
  <g>
    <ellipse cx="420" cy="380" rx="110" ry="30" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    <text x="420" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000" font-family="Arial">Quản lý Sân bay</text>
  </g>
  
  <g>
    <ellipse cx="420" cy="500" rx="110" ry="30" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    <text x="420" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000" font-family="Arial">Quản lý Đặt vé</text>
  </g>
  
  <g>
    <ellipse cx="420" cy="620" rx="120" ry="30" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="420" y="617" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Xem danh sách</text>
      <text x="420" y="633" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">người dùng</text>
    
  </g>
  
  <g>
    <ellipse cx="420" cy="730" rx="115" ry="28" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="420" y="727" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Cập nhật Profile</text>
      <text x="420" y="743" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Admin</text>
    
  </g>

  <!-- Extended Sub Use Cases (Right Column) -->
  
  <g>
    <ellipse cx="710" cy="140" rx="110" ry="26" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="710" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Xem biểu đồ</text>
      <text x="710" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">doanh thu</text>
    
  </g>
  
  
  <g>
    <ellipse cx="710" cy="220" rx="115" ry="26" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    <text x="710" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000" font-family="Arial">Thêm chuyến bay mới</text>
  </g>
  
  <g>
    <ellipse cx="710" cy="280" rx="125" ry="26" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="710" y="277" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Cập nhật lịch bay</text>
      <text x="710" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">& giá vé gốc</text>
    
  </g>

  
  <g>
    <ellipse cx="710" cy="380" rx="115" ry="26" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="710" y="377" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Thêm / Sửa / Xóa</text>
      <text x="710" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">sân bay</text>
    
  </g>

  
  <g>
    <ellipse cx="710" cy="500" rx="120" ry="26" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="710" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Xử lý yêu cầu</text>
      <text x="710" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Đổi / Hủy vé</text>
    
  </g>

  
  <g>
    <ellipse cx="710" cy="590" rx="115" ry="26" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="710" y="587" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Khóa / Mở khóa</text>
      <text x="710" y="603" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">tài khoản</text>
    
  </g>
  
  <g>
    <ellipse cx="710" cy="650" rx="125" ry="26" fill="#FFFFC0" stroke="#000000" stroke-width="2"/>
    
      <text x="710" y="647" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">Phân quyền Role</text>
      <text x="710" y="663" text-anchor="middle" font-size="12" font-weight="bold" fill="#000000" font-family="Arial">(Admin / Customer)</text>
    
  </g>

  <!-- Lines from Actor to Primary Use Cases -->
  <line x1="120" y1="400" x2="310" y2="140" stroke="#000000" stroke-width="1.8"/>
  <line x1="120" y1="405" x2="305" y2="260" stroke="#000000" stroke-width="1.8"/>
  <line x1="120" y1="410" x2="310" y2="380" stroke="#000000" stroke-width="1.8"/>
  <line x1="120" y1="415" x2="310" y2="500" stroke="#000000" stroke-width="1.8"/>
  <line x1="120" y1="420" x2="300" y2="620" stroke="#000000" stroke-width="1.8"/>
  <line x1="120" y1="425" x2="305" y2="730" stroke="#000000" stroke-width="1.8"/>

  <!-- Extend Relations (Dashed arrows from Extended to Base) -->
  
  <g>
    <line x1="600" y1="140" x2="530" y2="140" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <rect x="533" y="130" width="64" height="18" fill="#FFFFFF" opacity="0.9"/>
    <text x="565" y="143" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial">&lt;&lt;extend&gt;&gt;</text>
  </g>
  
  
  <g>
    <line x1="595" y1="220" x2="520" y2="250" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <rect x="525.5" y="225" width="64" height="18" fill="#FFFFFF" opacity="0.9"/>
    <text x="557.5" y="238" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial">&lt;&lt;extend&gt;&gt;</text>
  </g>
  
  <g>
    <line x1="585" y1="280" x2="535" y2="270" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <rect x="528" y="265" width="64" height="18" fill="#FFFFFF" opacity="0.9"/>
    <text x="560" y="278" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial">&lt;&lt;extend&gt;&gt;</text>
  </g>

  
  <g>
    <line x1="595" y1="380" x2="530" y2="380" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <rect x="530.5" y="370" width="64" height="18" fill="#FFFFFF" opacity="0.9"/>
    <text x="562.5" y="383" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial">&lt;&lt;extend&gt;&gt;</text>
  </g>

  
  <g>
    <line x1="590" y1="500" x2="530" y2="500" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <rect x="528" y="490" width="64" height="18" fill="#FFFFFF" opacity="0.9"/>
    <text x="560" y="503" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial">&lt;&lt;extend&gt;&gt;</text>
  </g>

  
  <g>
    <line x1="595" y1="590" x2="525" y2="610" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <rect x="528" y="590" width="64" height="18" fill="#FFFFFF" opacity="0.9"/>
    <text x="560" y="603" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial">&lt;&lt;extend&gt;&gt;</text>
  </g>
  
  <g>
    <line x1="585" y1="650" x2="525" y2="630" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
    <rect x="523" y="630" width="64" height="18" fill="#FFFFFF" opacity="0.9"/>
    <text x="555" y="643" text-anchor="middle" font-size="11" fill="#000000" font-family="Arial">&lt;&lt;extend&gt;&gt;</text>
  </g>

</svg>