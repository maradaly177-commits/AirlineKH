  </g>
  
    <circle cx="390" cy="500" r="15" fill="none" stroke="#1E40AF" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="390" cy="500" r="9" fill="#1E40AF"/>

  
  <g>
