    <text x="375" y="249" text-anchor="middle" font-size="11" font-weight="600" fill="#475569">Hợp lệ</text>
  </g>
  
  <g>
    <line x1="285" y1="210" x2="180" y2="210" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
  </g>
  
  <g>
    <line x1="180" y1="210" x2="180" y2="130" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
