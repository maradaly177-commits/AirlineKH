  </g>
  
  <g>
    <line x1="375" y1="320" x2="375" y2="360" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
  </g>
  
  <g>
    <line x1="375" y1="400" x2="375" y2="430" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
