    <text x="375" y="379" text-anchor="middle" font-size="12" font-weight="600" fill="#1E293B">Lưu thay đổi vào CSDL</text>
  </g>
  
    <circle cx="375" cy="430" r="15" fill="none" stroke="#1E40AF" stroke-width="3" filter="url(#shadow)"/>
    <circle cx="375" cy="430" r="9" fill="#1E40AF"/>

  
  <g>
    <line x1="375" y1="84" x2="375" y2="110" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
  </g>
  
  <g>
    <line x1="375" y1="150" x2="375" y2="190" stroke="#475569" stroke-width="1.8"  marker-end="url(#arrow)"/>
    
