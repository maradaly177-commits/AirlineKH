name: Deploy AirlineKH to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Continuous Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment on AWS EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "🚀 GitHub Actions is triggering auto-deploy..."
            cd /var/www/AirlineKH
            chmod +x deploy.sh
            ./deploy.sh
            echo "✅ Auto-deployment completed successfully!"
